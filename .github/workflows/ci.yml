name: CI

# Test seti yazılıp üç hafta sonra çürümesin diye: her push/PR'da koşar.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/avk_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/avk_test
      # Build sırasında lazily init edilen servisler — gerçek anahtar gerekmez.
      SUPABASE_URL: http://localhost:54321
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      RESEND_API_KEY: test-resend-key
      EMAIL_FROM: test@example.com

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx drizzle-kit push --force
      - run: npm run lint
      - run: npm test
      - run: npm run build
